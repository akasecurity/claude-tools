<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2530"/>
      <stop offset="1" stop-color="#232F3E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="6" rx="3" fill="#00E0B8"/>
  <g transform="translate(72,92) scale(0.72)" fill="#00E0B8">
    <circle cx="61.07" cy="20.37" r="20.37"/>
    <path d="M0 88.666 A40.746 40.746 0 0 1 81.492 88.666 Z"/>
    <path d="M81.492 88.666 A40.746 40.746 0 0 1 0 88.666 Z" fill-opacity="0.55"/>
    <circle cx="20.42" cy="157.05" r="20.37" fill-opacity="0.55"/>
  </g>
  <text x="190" y="140" font-family="ui-monospace, 'Geist Mono', monospace" font-size="50" font-weight="700" fill="#F6F8F9">aka-claude-tools</text>
  <text x="192" y="186" font-size="25" font-weight="400" fill="#B0C7E2">The clean slate a fresh Claude Code should start from.</text>
  <g font-family="ui-monospace, 'Geist Mono', monospace" fill="#6B7D8F">
    <text x="192" y="236" font-size="16"><tspan fill="#7DF8E2">clean context</tspan>  ·  <tspan fill="#A0E7FF">locked doors</tspan>  ·  <tspan fill="#C3CBFF">guarded exits</tspan></text>
    <text x="192" y="268" font-size="15">MIT  ·  needs jq + bun  ·  side-by-side or in-place</text>
  </g>

  <!-- Signature motif: the agent's actions pass a guard; safe allowed, risky blocked -->
  <g font-family="ui-monospace, 'Geist Mono', monospace" font-size="14" fill="#6B7D8F">
    <g stroke-width="2.5" fill="none" opacity="0.55">
      <path d="M872 170 L967 170" stroke="#00E0B8"/>
      <path d="M1004 160 L1082 120" stroke="#00E0B8"/>
      <path d="M1004 182 L1082 222" stroke="#F76F68"/>
    </g>
    <circle cx="860" cy="170" r="11" fill="none" stroke="#00E0B8" stroke-width="2.5"/><circle cx="860" cy="170" r="4.5" fill="#00E0B8"/>
    <text x="860" y="144" text-anchor="middle">agent</text>
    <rect x="971" y="153" width="34" height="34" rx="8" fill="none" stroke="#00E0B8" stroke-width="2.5"/>
    <path d="M980 170 l6 6 l12 -13" fill="none" stroke="#00E0B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="988" y="212" text-anchor="middle" fill="#00E0B8">guard</text>
