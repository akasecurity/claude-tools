    <path d="M1092 120 l4 4 l8 -9" fill="none" stroke="#00E0B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1128" y="125" fill="#7DF8E2">allowed</text>
    <circle cx="1098" cy="222" r="12" fill="#F76F68" fill-opacity="0.15" stroke="#F76F68" stroke-width="2"/>
    <path d="M1093 217 l10 10 M1103 217 l-10 10" stroke="#F76F68" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1128" y="227" fill="#F76F68">blocked</text>
  </g>
</svg>
