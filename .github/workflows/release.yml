name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # create GitHub Releases and upload assets
  id-token: write    # npm provenance attestation

jobs:
  release:
    name: Build, publish, and release
    runs-on: ubuntu-latest
    # Releases must originate ONLY from the PUBLIC repo: the download/Homebrew URLs
    # below hardcode akasecurity/claude-tools, and `npm publish --provenance`
    # can only generate a public attestation from a public source repo. This workflow
    # also ships into the private -dev repo via the dev→public sync, so without this
    # guard a `v*` tag pushed in -dev would create a release in the wrong repo with
    # 404 install URLs and a failing provenance publish. The guard makes it a no-op
    # in -dev and correct in public.
    if: github.repository == 'akasecurity/claude-tools'
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION="$(cat VERSION)"
          TAG_VERSION="${{ steps.ver.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: '24'   # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          registry-url: 'https://registry.npmjs.org'

      - name: Preflight — npm CLI supports trusted publishing (OIDC)
        run: |
          # Publishing authenticates with the workflow's OIDC identity (npm trusted publisher
          # configured on npmjs.com for akasecurity/claude-tools + release.yml); there is no
          # NPM_TOKEN. OIDC cannot be probed without publishing, so fail early on the one thing
          # we can check: an npm CLI too old to do the token exchange.
          npm --version
          node -e "
            const [a,b,c]=process.argv[1].split('.').map(Number);
            if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('::error::npm '+process.argv[1]+' < 11.5.1: no trusted publishing'); process.exit(1); }
          " "$(npm --version)"

      - name: Sync package.json version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Check whether this version is already on npm
        id: npmcheck
        run: |
          # A rerun of the same tag (for example after the Release step failed) must not die on
          # npm's "cannot publish over an existing version": skip the publish and carry on.
          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${{ steps.ver.outputs.version }} is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npmcheck.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Create distribution tarball
        id: tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TARBALL="aka-claude-tools-${VERSION}.tar.gz"
          STAGEDIR="stage/aka-claude-tools-${VERSION}"
          mkdir -p "$STAGEDIR"
          cp -r bin install.sh uninstall.sh shared config \
            agent-install.md agent-uninstall.md llms.txt \
            VERSION README.md LICENSE CHANGELOG.md "$STAGEDIR/"
          tar -czf "$TARBALL" -C stage "aka-claude-tools-${VERSION}"
          SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"   >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.tarball.outputs.tarball }}
          generate_release_notes: true
          body: |
            ## Installation

            **npm / npx**
            ```bash
            npx @akasecurity/claude-tools          # one-shot
            npm install -g @akasecurity/claude-tools && aka-claude-tools  # permanent
            ```

            **Homebrew** — update [`packaging/homebrew/aka-claude-tools.rb`](packaging/homebrew/aka-claude-tools.rb) in the tap repo:
            ```
            url "https://github.com/akasecurity/claude-tools/releases/download/${{ github.ref_name }}/aka-claude-tools-${{ steps.ver.outputs.version }}.tar.gz"
            sha256 "${{ steps.tarball.outputs.sha256 }}"
            ```

            **Direct download**
            ```bash
            # SHA-256: ${{ steps.tarball.outputs.sha256 }}
            curl -fsSLO https://github.com/akasecurity/claude-tools/releases/download/${{ github.ref_name }}/aka-claude-tools-${{ steps.ver.outputs.version }}.tar.gz
            ```
