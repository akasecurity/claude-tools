name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flow:
    name: pipeline flow tests (ubuntu-latest)
    # ubuntu (GNU userland) ONLY. The macOS (BSD) leg was dropped: the dev fleet is
    # all-Mac, so `bash tests/run.sh` run locally already exercises the BSD path on
    # every change — the macos-latest runner (10x minute multiplier) just paid to
    # repeat coverage we have for free. GNU userland is the leg we CAN'T reproduce
    # locally, and it's what matters for the Linux users this installer ships to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # bun is a real dependency of the command-guard + statusline hooks (.ts files):
      # install.sh only deploys+registers command-guard when bun is present and ABORTS if
      # statusline is selected without it, so CI needs bun to exercise the full recommended
      # install the flow suite asserts.
      - uses: oven-sh/setup-bun@v2
      - name: Install RTK compatibility baseline
        # Pin the binary and its digest; no rtk init or live profile changes.
        run: |
          set -euo pipefail
          RTK_DIR="$(mktemp -d)"
          curl --fail --location --retry 3 -o "$RTK_DIR/rtk.tar.gz" \
            https://github.com/rtk-ai/rtk/releases/download/v0.49.0/rtk-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 7278231dfd7e6a730a4ab7f847b195bcf02289c2d57622b0dab75a6411100c8f "$RTK_DIR/rtk.tar.gz" | sha256sum --check
          tar -xzf "$RTK_DIR/rtk.tar.gz" -C "$RTK_DIR"
          echo "$RTK_DIR" >> "$GITHUB_PATH"
      - name: Install ripgrep
        # rtk's `rg` rewrite shells out to the system `rg` binary, which the real-RTK
        # search-contract tests in tests/rtk-safe-behavior.test.ts exercise directly.
        # ubuntu-latest does not ship ripgrep by default.
        run: sudo apt-get update -y && sudo apt-get install -y ripgrep
      - name: Install bubblewrap (bwrap)
        # The opt-in `sandbox` addition requires bwrap on PATH on Linux (soft-skipped,
        # with a notice, when it's absent — see settings.sandbox.json / test_scn_sandbox.sh).
        # Without it here, every "normal" sandbox scenario in that test soft-skips instead
        # of exercising the real enable/stash/ownership behavior, and only the explicit
        # linux-no-bwrap scenario (which hides bwrap on purpose) would ever pass.
        # ubuntu-latest does not ship bubblewrap by default.
        run: sudo apt-get update -y && sudo apt-get install -y bubblewrap
      - name: tool versions
        run: |
          bash --version | head -1
          jq --version
          git --version
          bun --version
      - name: typecheck the bun hooks (command-guard.ts, statusline.ts)
        # Static analysis the all-bash suite can't provide. tsconfig.json restricts the
        # program to config/hooks/*.ts + tests/*.test.ts; @types/bun is a dev-only dep
        # (the hooks themselves run with zero dependencies).
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
      - name: run the flow suite
        env:
          CT_REQUIRE_RTK: "1"
        # Sandboxed (fake $HOME, throwaway clones) — touches no real profile.
        # Exercises: install.sh forward deploy + path remap, additions.json
        # manifest integrity (no orphans / missing files), and promote.sh
        # reverse round-trip + leak-guard rejection.
        run: bash tests/run.sh
